name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the oldest supported (package.json "engines"); 26 is the current LTS (.nvmrc).
        node: ['24', '26']
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Placeholders so the build can run: nothing here is a real project. The pages fetch no data (the address does not
      # resolve), which is enough to prove the build and the generated routes.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Lint (zero warnings)
        run: npm run lint
      # Includes the database tests: the SQL migrations run for real, in Postgres compiled to WASM (no service needed),
      # and a check that supabase/setup.sql is exactly the migrations.
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit
      - name: Upload coverage
        if: matrix.node == '26'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
